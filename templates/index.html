<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Assistant</title>
    <style>
        :root {
            --bg: #f5f7ff;
            --card: rgba(255,255,255,.88);
            --text: #172033;
            --muted: #6b7280;
            --primary: #635bff;
            --secondary: #a855f7;
            --border: rgba(99,91,255,.14);
            --user: linear-gradient(135deg, #635bff, #9b5cff);
            --bot: #f1f3fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(168,85,247,.18), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(99,91,255,.16), transparent 30%),
                var(--bg);
        }

        .app {
            width: min(1050px, 94%);
            height: 92vh;
            margin: 4vh auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(40, 45, 90, .15);
            backdrop-filter: blur(18px);
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 22px 26px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,.68);
        }

        .logo {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: white;
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 10px 25px rgba(99,91,255,.28);
        }

        header h1 { margin: 0; font-size: 20px; }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .status {
            margin-left: auto;
            padding: 7px 11px;
            border-radius: 999px;
            background: #ecfdf3;
            color: #16834d;
            font-size: 12px;
            font-weight: 700;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 680px;
            margin: 8vh auto;
            text-align: center;
        }

        .welcome .spark { font-size: 48px; }
        .welcome h2 { margin: 12px 0 8px; font-size: 30px; }
        .welcome p { color: var(--muted); line-height: 1.6; }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        .suggestions button {
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s;
        }

        .suggestions button:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .message {
            display: flex;
            margin: 14px 0;
            animation: appear .25s ease;
        }

        .message.user { justify-content: flex-end; }

        .bubble {
            max-width: 76%;
            padding: 13px 17px;
            border-radius: 20px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            color: white;
            background: var(--user);
            border-bottom-right-radius: 6px;
        }

        .bot .bubble {
            background: var(--bot);
            border-bottom-left-radius: 6px;
        }

        .composer {
            padding: 18px 22px 22px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,.72);
        }

        form {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 30px rgba(45, 50, 100, .08);
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            padding: 10px 12px;
            border: 0;
            outline: 0;
            font: inherit;
            color: var(--text);
            background: transparent;
        }

        #send {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 14px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
            font-size: 18px;
        }

        #send:disabled { opacity: .55; cursor: not-allowed; }

        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 18px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #777;
            animation: bounce .8s infinite alternate;
        }

        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce { to { transform: translateY(-5px); opacity: .45; } }
        @keyframes appear {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            .app { width: 100%; height: 100vh; margin: 0; border-radius: 0; }
            header { padding: 17px; }
            #chat { padding: 18px; }
            .bubble { max-width: 88%; }
            .status { display: none; }
            .welcome { margin: 10vh auto; }
            .welcome h2 { font-size: 25px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo">✦</div>
        <div>
            <h1>Digital Marketing Assistant</h1>
            <p>Your focused study companion for digital marketing</p>
        </div>
        <div class="status">● Online</div>
    </header>

    <main id="chat">
        <section class="welcome" id="welcome">
            <div class="spark">📈</div>
            <h2>Learn. Plan. Grow.</h2>
            <p>Ask me about SEO, social media, content marketing, email marketing, analytics, digital advertising, and other digital marketing topics.</p>
            <div class="suggestions">
                <button onclick="useSuggestion('What is digital marketing?')">What is digital marketing?</button>
                <button onclick="useSuggestion('Explain SEO in simple words.')">Explain SEO</button>
                <button onclick="useSuggestion('What are important digital marketing KPIs?')">Digital marketing KPIs</button>
            </div>
        </section>
    </main>

    <div class="composer">
        <form id="chatForm">
            <textarea id="message" placeholder="Ask a digital marketing question..." rows="1" required></textarea>
            <button id="send" type="submit" aria-label="Send">➤</button>
        </form>
    </div>
</div>

<script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function useSuggestion(text) {
        input.value = text;
        input.focus();
    }

    function addMessage(text, type) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${type}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return wrapper;
    }

    function addTyping() {
        const wrapper = document.createElement("div");
        wrapper.className = "message bot";
        wrapper.id = "typing";

        const bubble = document.createElement("div");
        bubble.className = "bubble typing";
        bubble.innerHTML = "<span></span><span></span><span></span>";

        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        welcome?.remove();
        addMessage(message, "user");
        input.value = "";
        input.style.height = "auto";
        send.disabled = true;
        addTyping();

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            document.getElementById("typing")?.remove();
            addMessage(data.reply || "Sorry, I couldn't generate a response.", "bot");
        } catch (error) {
            document.getElementById("typing")?.remove();
            addMessage("Sorry, something went wrong while connecting to the assistant.", "bot");
        } finally {
            send.disabled = false;
            input.focus();
        }
    });

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
</script>
</body>
</html>
